[project]
name = "weave-cv"
version = "0.1.7"
description = "An agent that tailors your resume to a job posting — without inventing anything new"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.9.1",
    "langchain>=1.3.13",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.4.1",
    "langchain-anthropic>=1.0.0",
    "langchain-google-genai>=3.0.0",
    "langchain-groq>=1.0.0",
    "langchain-xai>=1.0.0",
    "langchain-deepseek>=1.0.0",
    "mcp>=1.28.1,<2",
    "openpyxl>=3.1.5",
    "pypandoc>=1.17",
    "rich>=13.9.0",
    "texsoup>=0.3.3",
    "tomli-w>=1.2.0",
    "typer>=0.15.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "twine>=7.0.0",
]

[project.scripts]
weave-cv = "weave_cv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weave_cv"]
